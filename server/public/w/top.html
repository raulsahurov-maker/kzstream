<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>KZStream — ТОП</title>
<link rel="stylesheet" href="/w/w.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&family=Montserrat:wght@700;900&family=Oswald:wght@600;700&family=Rubik:wght@700;900&display=swap" rel="stylesheet">
<style>
  #root{--r:16px;--o:.9;--ri:max(4px,calc(var(--r) - 6px));--fs:17px;--glow:rgba(255,59,92,.5);width:420px;margin:10px}
  .f-manrope{font-family:Manrope,sans-serif}.f-montserrat{font-family:Montserrat,sans-serif}.f-unbounded{font-family:Unbounded,sans-serif}
  .f-oswald{font-family:Oswald,sans-serif;letter-spacing:.03em}.f-rubik{font-family:Rubik,sans-serif}.f-inter{font-family:Inter,sans-serif}
  .sz-sm{--fs:14px}.sz-md{--fs:17px}.sz-lg{--fs:21px}
  .f-unbounded.sz-sm{--fs:12.5px}.f-unbounded.sz-md{--fs:15px}.f-unbounded.sz-lg{--fs:18px}

  .box{padding:14px}
  .hd{text-align:center;padding:.55em .8em;font-weight:900;text-transform:uppercase;font-size:calc(var(--fs)*1.08);margin-bottom:10px}
  .list{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:.58em .8em;font-size:var(--fs);font-weight:700;animation:in .5s both}
  .row .l{display:flex;align-items:center;gap:.55em;min-width:0}
  .pos{flex-shrink:0;width:1.55em;height:1.55em;border-radius:50%;display:grid;place-items:center;font-size:.72em;font-weight:900;opacity:.55}
  .row:nth-child(1) .pos{background:#0b0f19;color:#fbbf24;opacity:1}
  .row:nth-child(2) .pos{background:#1e293b;color:#e2e8f0;opacity:1}
  .row:nth-child(3) .pos{background:rgba(120,53,15,.85);color:#fde68a;opacity:1}
  .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sm{white-space:nowrap;font-weight:900;font-variant-numeric:tabular-nums}
  .row.first{font-weight:900;transform:scale(1.02);margin:2px 0;animation:in .5s both,glow 2.8s infinite ease-in-out}
  @keyframes in{from{opacity:0;transform:translateX(-14px)}}
  /* плавная перестановка: строки, которые уже были, не «въезжают» заново */
  .row.keep{animation:none}
  .row.first.keep{animation:glow 2.8s infinite ease-in-out}
  .st-classic .row.first.keep{animation:none}
  .row.mv{transition:translate .9s cubic-bezier(.22,1,.36,1)}
  .row.up{animation:rise 1.4s ease-out;position:relative;z-index:3}
  .row.first.up{animation:rise 1.4s ease-out,glow 2.8s 1.4s infinite ease-in-out}
  @keyframes rise{0%{filter:brightness(1.7) drop-shadow(0 0 14px rgba(255,210,63,.9))}100%{filter:none}}
  .sm.cnt{animation:bump .5s ease-out}
  @keyframes bump{50%{scale:1.18}}
  @keyframes glow{0%,100%{box-shadow:0 0 18px var(--glow)}50%{box-shadow:0 0 32px var(--glow)}}
  .empty{font-size:calc(var(--fs)*.9);padding:.5em 0;text-align:center;min-height:3.6em;display:flex;align-items:center;justify-content:center}
  .empty .e1{opacity:.75;animation:fadeIn .6s both}
  .promo{display:flex;flex-direction:column;align-items:center;gap:.25em;animation:promoIn .7s cubic-bezier(.2,1.3,.4,1) both}
  .promo .pl{display:flex;align-items:center;gap:.45em;font-family:Unbounded,sans-serif;font-weight:800;font-size:1.15em;letter-spacing:.01em}
  .promo .pm{width:1.5em;height:1.5em;border-radius:.45em;background:linear-gradient(135deg,#ff3b5c,#ff7a45);display:grid;place-items:center;box-shadow:0 0 16px rgba(255,59,92,.6)}
  .promo .pm svg{width:.8em;height:.8em}
  .promo .pt{background:linear-gradient(120deg,#ff3b5c,#ff7a45,#ffc84a);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
  .promo .ps{font-size:.78em;opacity:.85;font-weight:800}
  @keyframes promoIn{from{opacity:0;transform:scale(.7) translateY(8px)}}
  @keyframes fadeIn{from{opacity:0}}


  /* 6. Vice City — неоновый закат в духе GTA 6 (всё нарисовано кодом) */
  .scene{display:none}
  .st-vice{--glow:rgba(255,62,165,.55)}
  .st-vice .box{position:relative;overflow:hidden;border-radius:var(--r);padding:14px 14px 16px;border:2px solid rgba(255,120,200,.55);box-shadow:0 0 26px rgba(255,62,165,.35),0 14px 40px rgba(0,0,0,.5)}
  .st-vice .scene{display:block;position:absolute;inset:0;z-index:0}
  .st-vice .scene svg{width:100%;height:100%;display:block}
  .st-vice .hd,.st-vice .list{position:relative;z-index:1}
  .st-vice .hd{font-family:Oswald,Unbounded,sans-serif;font-style:italic;font-weight:700;font-size:calc(var(--fs)*2.7);line-height:1.05;letter-spacing:.02em;padding:.05em 0 .2em;margin-bottom:10px;
    background:linear-gradient(180deg,#fff7a8 0%,#ffd23f 30%,#ff8a3d 58%,#ff3ea5 88%);-webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-stroke:3px #3a0a4a;paint-order:stroke fill;transform:skewX(-8deg);filter:drop-shadow(0 3px 0 #ff3ea5) drop-shadow(0 0 14px rgba(255,62,165,.75))}
  .st-vice .list{gap:9px}
  .st-vice .row{--c:#ff5ec8;background:linear-gradient(90deg,rgba(34,8,58,.62),rgba(60,14,80,.32));border:2px solid var(--c);border-radius:calc(var(--ri) + 2px);color:#fff;
    box-shadow:0 0 12px var(--c),inset 0 0 14px rgba(255,255,255,.06);font-family:Oswald,Unbounded,sans-serif;font-style:italic;font-weight:700;font-size:calc(var(--fs)*1.25);text-transform:uppercase;padding:.42em .8em;letter-spacing:.02em}
  .st-vice .row .nm,.st-vice .row .sm{text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 10px var(--c)}
  .st-vice .row .sm{color:#fff}
  .st-vice .pos{display:none}
  .st-vice .row:nth-child(1){--c:#ffd23f;--glow:rgba(255,210,63,.7);background:linear-gradient(90deg,rgba(90,40,10,.75),rgba(120,30,90,.55))}
  .st-vice .row:nth-child(1) .nm,.st-vice .row:nth-child(1) .sm{background:linear-gradient(180deg,#fff7a8,#ffc23a 55%,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 2px 0 #5a1d00) drop-shadow(0 0 8px rgba(255,190,60,.8))}
  .st-vice .row:nth-child(1) .nm::before{content:"👑 ";-webkit-text-fill-color:initial}
  .st-vice .row:nth-child(2){--c:#3ee8ff}.st-vice .row:nth-child(2) .nm{color:#ff9be0}
  .st-vice .row:nth-child(3){--c:#ff5ec8}.st-vice .row:nth-child(3) .nm{color:#ffc2ef}
  .st-vice .row:nth-child(4){--c:#9b6bff}.st-vice .row:nth-child(4) .nm{color:#c9b6ff}
  .st-vice .row:nth-child(5){--c:#2ff5c8}.st-vice .row:nth-child(5) .nm{color:#9dffe8}
  .st-vice .row.first{transform:none;margin:0}
  .st-vice .empty{color:#fff;text-shadow:0 0 10px #ff3ea5}

  /* 1. Классика KZStream — цвета берутся из выбранной цветовой темы */
  .st-classic .box{background:var(--bg,var(--w-bg));border:1px solid rgba(255,255,255,.08);border-radius:var(--r);box-shadow:0 10px 40px rgba(0,0,0,.35);padding:14px 18px;color:var(--w-fg)}
  .st-classic .hd{text-align:left;padding:0;margin-bottom:8px;font-size:calc(var(--fs)*.92);letter-spacing:.06em;background:linear-gradient(120deg,var(--w-a),var(--w-b));-webkit-background-clip:text;background-clip:text;color:transparent}
  .st-classic.f-manrope .hd{font-family:Unbounded,sans-serif}
  .st-classic .list{gap:0}
  .st-classic .row{padding:.45em 0;border-bottom:1px solid rgba(128,128,128,.18)}
  .st-classic .row:last-child{border:none}
  .st-classic .row.first{transform:none;margin:0;font-weight:700;animation:in .5s both}
  .st-classic .pos,.st-classic .row:nth-child(n) .pos{width:1.75em;height:1.75em;border-radius:.5em;background:rgba(128,128,128,.18);color:inherit;opacity:1}
  .st-classic .row:nth-child(1) .pos{background:linear-gradient(120deg,var(--w-a),var(--w-b));color:#fff}
  .st-classic .sm{color:var(--w-b)}

  /* 2. Cyberpunk Glass — неон и стекло */
  .st-glassneon{--glow:rgba(236,72,153,.6)}
  .st-glassneon .box{background:rgba(13,16,27,var(--o));backdrop-filter:blur(16px);border:1px solid rgba(236,72,153,.35);box-shadow:0 0 30px rgba(6,182,212,.2);border-radius:var(--r)}
  .st-glassneon .hd{background:linear-gradient(90deg,#ec4899,#8b5cf6,#06b6d4);color:#fff;text-shadow:0 0 10px rgba(255,255,255,.5);border-radius:var(--ri)}
  .st-glassneon .row{background:rgba(255,255,255,.05);border:1px solid rgba(6,182,212,.28);color:#38bdf8;border-radius:var(--ri)}
  .st-glassneon .row.first{background:linear-gradient(90deg,rgba(236,72,153,.92),rgba(139,92,246,.92));color:#fff;border-color:#f472b6}

  /* 3. Esports Elite — острые углы */
  .st-esports{--glow:rgba(250,204,21,.6)}
  .st-esports .box{background:rgba(10,10,12,var(--o));border:1px solid #27272a;border-left:4px solid #facc15;clip-path:polygon(0 0,calc(100% - 15px) 0,100% 15px,100% 100%,15px 100%,0 calc(100% - 15px))}
  .st-esports .hd{background:#facc15;color:#000;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
  .st-esports .row{background:#18181b;border-left:3px solid #3f3f46;color:#f4f4f5;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
  .st-esports .row.first{background:linear-gradient(90deg,#facc15,#eab308);color:#000;border-left-color:#000;transform:none}

  /* 4. Dark & Gold — премиум золото */
  .st-darkgold{--glow:rgba(212,175,55,.45)}
  .st-darkgold .box{background:rgba(18,18,20,var(--o));border:1px solid rgba(212,175,55,.38);border-radius:var(--r);box-shadow:0 20px 40px rgba(0,0,0,.6)}
  .st-darkgold .hd{background:linear-gradient(135deg,#bf953f,#fcf6ba,#b38728,#fbf5b7);color:#121214;letter-spacing:.12em;border-radius:var(--ri)}
  .st-darkgold .row{background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.22);color:#e4e4e7;border-radius:var(--ri)}
  .st-darkgold .row.first{background:linear-gradient(135deg,#d4af37,#fff2b2,#aa771c);color:#121214;border-color:#d4af37}

  /* 5. Futuristic HUD — игровой интерфейс */
  .st-hud{--glow:rgba(16,185,129,.5)}
  .st-hud .box{background:rgba(6,24,24,var(--o));border:2px solid #10b981;box-shadow:0 0 20px rgba(16,185,129,.25);border-radius:var(--r)}
  .st-hud .hd{background:rgba(16,185,129,.15);border:1px solid #10b981;color:#10b981;letter-spacing:.18em;border-radius:var(--ri)}
  .st-hud .row{background:rgba(6,24,24,.6);border:1px solid rgba(16,185,129,.32);color:#a7f3d0;border-radius:var(--ri)}
  .st-hud .row.first{background:rgba(16,185,129,.3);border-color:#34d399;color:#6ee7b7}
  .st-hud .row:nth-child(1) .pos{color:#6ee7b7}
  /* ===== Камин ===== */
  .fire{display:none}
  .st-fire{--glow:rgba(255,140,40,.6)}
  .st-fire .box{position:relative;overflow:hidden;border-radius:var(--r);padding:16px 16px 0;border:3px solid #3a1d10;
    background:
      linear-gradient(180deg,rgba(20,8,4,.82),rgba(36,12,4,.86)),
      repeating-linear-gradient(0deg,#5a2a18 0 22px,#2a120a 22px 25px),
      #3a1a0e;
    box-shadow:inset 0 0 0 6px #6b3a22,inset 0 0 0 8px #1e0d06,0 0 40px rgba(255,120,30,.35),0 16px 44px rgba(0,0,0,.6)}
  .st-fire .box::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 100%,rgba(255,140,40,.35),transparent 60%);animation:fglow 2.2s ease-in-out infinite;pointer-events:none}
  .st-fire .hd,.st-fire .list{position:relative;z-index:2}
  .st-fire .hd{font-family:Unbounded,sans-serif;font-weight:800;font-size:calc(var(--fs)*1.5);letter-spacing:.08em;text-align:center;color:#ffe2a8;padding:10px 12px;margin:0 -6px 12px;
    background:linear-gradient(180deg,#7a4524,#4a2512);border:2px solid #9c5a2e;border-radius:8px;box-shadow:0 6px 0 #2a1208,0 10px 18px rgba(0,0,0,.5);
    text-shadow:0 0 10px rgba(255,170,60,.9),0 2px 0 #2a1208}
  .st-fire .hd{display:flex;align-items:center;justify-content:center;gap:12px}
  .st-fire .hd::before,.st-fire .hd::after{content:"";flex:none;width:calc(var(--fs)*3.1);height:calc(var(--fs)*4.2);margin:-22px 0 -10px;background:url(/img/top/flame.png) center/contain no-repeat;filter:drop-shadow(0 0 8px rgba(255,140,30,.8));transform-origin:50% 100%;animation:mascot 1.4s ease-in-out infinite alternate}
  .st-fire .hd::after{animation-delay:-.7s}
  @keyframes mascot{0%{transform:rotate(-6deg) scale(1)}100%{transform:rotate(6deg) scale(1.08)}}
  .st-fire .list{gap:8px}
  .st-fire .row{background:linear-gradient(90deg,rgba(60,24,10,.85),rgba(30,12,6,.8));border:1.5px solid rgba(255,140,50,.35);border-radius:var(--ri);color:#ffe9c7;box-shadow:inset 0 0 14px rgba(255,110,20,.12)}
  .st-fire .row .sm{color:#ffb547;text-shadow:0 0 8px rgba(255,150,40,.7)}
  .st-fire .row .pos{background:#ff8a2a;color:#2a1208}
  .st-fire .row:nth-child(1){border-color:#ffb547;background:linear-gradient(90deg,rgba(150,60,10,.9),rgba(70,20,6,.85));box-shadow:0 0 18px rgba(255,140,30,.55),inset 0 0 14px rgba(255,200,80,.25);animation:frow 1.8s ease-in-out infinite}
  .st-fire .row:nth-child(1) .nm{color:#fff3c4;text-shadow:0 0 10px #ff9a2a}
  .st-fire .row:nth-child(1) .nm::before{content:"";display:inline-block;width:1.5em;height:1.3em;margin-right:.35em;vertical-align:-.25em;background:url(/img/top/crown.png) center/contain no-repeat;filter:drop-shadow(0 0 6px rgba(255,200,60,.8))}
  .st-fire .row.first{transform:none;margin:0}
  .st-fire .empty{color:#ffe2a8;text-shadow:0 0 10px #ff8a2a}
  .st-fire .fire{display:block;position:relative;z-index:1;height:118px;margin:14px -16px 0;border-top:8px solid #2a1208;
    background:radial-gradient(80% 90% at 50% 100%,#3a1206,#120502 70%);box-shadow:inset 0 10px 18px rgba(0,0,0,.7)}
  .fire .logs{position:absolute;left:50%;bottom:8px;width:190px;height:26px;transform:translateX(-50%)}
  .fire .logs i{position:absolute;bottom:0;height:16px;width:130px;border-radius:9px;background:linear-gradient(180deg,#6b3a1e,#3a1c0c);box-shadow:inset 0 -3px 0 #24100a}
  .fire .logs i:nth-child(1){left:0;transform:rotate(9deg)}.fire .logs i:nth-child(2){right:0;transform:rotate(-9deg)}
  .fire .logs i:nth-child(3){left:35px;bottom:8px;width:120px;background:linear-gradient(180deg,#7a4422,#40200e)}
  .fire .fl{position:absolute;bottom:18px;left:50%;width:46px;height:80px;margin-left:-23px;border-radius:50% 50% 45% 45% / 62% 62% 38% 38%;
    background:radial-gradient(60% 70% at 50% 80%,#fff6c0 0,#ffd23f 28%,#ff8a1f 55%,rgba(255,60,10,.0) 75%);filter:blur(1.5px);transform-origin:50% 100%;mix-blend-mode:screen;animation:flick 1.1s ease-in-out infinite alternate}
  .fire .fl:nth-child(2){margin-left:-62px;height:60px;width:40px;animation-duration:.9s;animation-delay:-.3s}
  .fire .fl:nth-child(3){margin-left:20px;height:64px;width:40px;animation-duration:1.3s;animation-delay:-.6s}
  .fire .fl:nth-child(4){margin-left:-40px;height:92px;width:36px;animation-duration:.8s;animation-delay:-.2s;opacity:.85}
  .fire .fl:nth-child(5){margin-left:2px;height:96px;width:34px;animation-duration:1s;animation-delay:-.5s;opacity:.85}
  .fire .fl:nth-child(6){margin-left:-90px;height:42px;width:34px;animation-duration:1.2s;opacity:.7}
  .fire .fl:nth-child(7){margin-left:52px;height:46px;width:34px;animation-duration:.95s;animation-delay:-.4s;opacity:.7}
  .fire .sp{position:absolute;bottom:40px;width:4px;height:4px;border-radius:50%;background:#ffcf5a;box-shadow:0 0 6px #ff8a1f;opacity:0;animation:spark 2.6s linear infinite}
  .fire .sp:nth-of-type(1){left:44%;animation-delay:0s}.fire .sp:nth-of-type(2){left:52%;animation-delay:.7s}.fire .sp:nth-of-type(3){left:48%;animation-delay:1.3s}
  .fire .sp:nth-of-type(4){left:56%;animation-delay:1.9s}.fire .sp:nth-of-type(5){left:40%;animation-delay:2.2s}
  @keyframes flick{0%{transform:scale(1,1) skewX(0)}30%{transform:scale(.92,1.08) skewX(3deg)}60%{transform:scale(1.06,.9) skewX(-4deg)}100%{transform:scale(.96,1.12) skewX(2deg)}}
  @keyframes spark{0%{opacity:0;transform:translate(0,0)}10%{opacity:1}100%{opacity:0;transform:translate(14px,-110px)}}
  @keyframes fglow{0%,100%{opacity:.75}50%{opacity:1}}
  @keyframes frow{0%,100%{box-shadow:0 0 14px rgba(255,140,30,.45),inset 0 0 14px rgba(255,200,80,.2)}50%{box-shadow:0 0 26px rgba(255,150,40,.75),inset 0 0 18px rgba(255,200,80,.35)}}
  /* ===== CS2 / FACEIT ===== */
  .lv{display:none}
  .st-cs2{--glow:rgba(255,140,0,.5)}
  .st-cs2 .box{position:relative;overflow:hidden;border-radius:calc(var(--r) * .4);padding:0 0 14px;border:2px solid #ff8a00;
    background:
      linear-gradient(180deg,rgba(14,15,19,.25),rgba(14,15,19,.55) 50%,rgba(14,15,19,.7)),
      url(/img/top/cs2bg.jpg) 30% center/cover no-repeat,
      #1b1d22;
    box-shadow:0 0 24px rgba(255,138,0,.35),0 16px 40px rgba(0,0,0,.6)}
  .st-cs2 .box::before{content:"";position:absolute;right:-40px;top:0;bottom:0;width:120px;background:linear-gradient(115deg,transparent 0 30%,#ff8a00 30% 42%,transparent 42% 55%,rgba(255,138,0,.5) 55% 60%,transparent 60%);opacity:.55;pointer-events:none}
  .st-cs2 .hd{position:relative;margin:0 0 12px;padding:14px 20px;color:#14100a;
    background:
      linear-gradient(115deg,transparent 0 63%,rgba(255,255,255,.9) 63% 63.8%,transparent 63.8% 66%,rgba(255,255,255,.75) 66% 66.6%,transparent 66.6% 84%,rgba(255,255,255,.55) 84% 84.5%,transparent 84.5%),
      linear-gradient(115deg,transparent 0 38%,#e9e9ea 38% 52%,transparent 52%),
      repeating-linear-gradient(115deg,transparent 0 18px,rgba(0,0,0,.05) 18px 20px),
      linear-gradient(115deg,#d9d9db 0 38%,#ff8a00 52% 100%);
    text-shadow:0 1px 0 rgba(255,255,255,.4);
    font-family:Oswald,Unbounded,sans-serif;font-weight:700;font-style:italic;text-transform:uppercase;letter-spacing:.08em;font-size:calc(var(--fs)*1.55);
    clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,0 100%);text-align:left}
  .st-cs2 .list{padding:0 12px;gap:7px}
  .st-cs2 .row{position:relative;border-radius:calc(var(--ri) * .3);background:linear-gradient(90deg,rgba(30,32,38,.82),rgba(20,21,25,.7));border:1px solid rgba(255,255,255,.08);border-left:4px solid #ff8a00;color:#f2f2f2;
    font-family:Oswald,Manrope,sans-serif;text-transform:uppercase;letter-spacing:.03em;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
  .st-cs2 .row .pos{display:none}
  .st-cs2 .row .lv{display:inline-block;flex:none;width:calc(var(--fs)*2.6);height:calc(var(--fs)*2.6);margin-right:10px}
  .st-cs2 .row .lv svg{width:100%;height:100%;display:block}
  .st-cs2 .row .sm{color:#ffb100;font-weight:700}
  .st-cs2 .row:nth-child(1){border-left-color:#fe1f00;background:linear-gradient(90deg,rgba(120,20,0,.85),rgba(40,16,10,.92));box-shadow:0 0 16px rgba(254,31,0,.45)}
  .st-cs2 .row:nth-child(1) .sm{color:#ff5a3c}
  .st-cs2 .row.first{transform:none;margin:0}
  .st-cs2 .empty{color:#ffb100;font-family:Oswald,sans-serif;text-transform:uppercase}
  /* ---- своё оформление ---- */
  .cust-bg .hd{background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.5)),var(--hbg) center/cover no-repeat !important;min-height:70px;display:flex !important;align-items:center;justify-content:center;color:#fff !important;text-shadow:0 2px 8px rgba(0,0,0,.8) !important;-webkit-text-fill-color:#fff !important;clip-path:none !important;transform:none !important}
  .cust-bg .hd::before,.cust-bg .hd::after{display:none !important}
  .cust-bgall .box{background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.6)),var(--hbg) center/cover no-repeat !important}
  .cust-bgall .scene,.cust-bgall .fire{display:none !important}
  .cust-row .row{background:linear-gradient(90deg,var(--rc),color-mix(in srgb,var(--rc) 55%,#000)) !important;border-color:color-mix(in srgb,var(--rc) 70%,#fff) !important;box-shadow:0 4px 14px color-mix(in srgb,var(--rc) 35%,transparent) !important}
  .cust-row .row::before,.cust-row .row::after{opacity:.25}
  .cust-tx .row,.cust-tx .row .nm,.cust-tx .row .sm,.cust-tx .row .pos{color:var(--rt) !important;-webkit-text-fill-color:var(--rt) !important}
</style></head><body>

<div class="ad" id="ad" style="display:none">KZStream · донаты через Kaspi</div>
<script src="/w/widget.js"></script>
<script>
(() => {
  const { on, start, theme, fmt, esc } = KZ;
  const demo = new URLSearchParams(location.search).has('demo'); // режим превью в кабинете
  const DEMO = [['ӘЛИХАН', 15000], ['DIAS_KZ', 8500], ['АЙГЕРІМ', 5000], ['НҰРСҰЛТАН', 2000], ['MIRA', 1000], ['ЕРЖАН', 900], ['АЙАРУ', 800], ['БАҚЫТ', 700], ['САБИНА', 600], ['НҰРБЕК', 500]].map(([name, total]) => ({ name, total }));
  const STYLES = ['classic', 'glassneon', 'esports', 'darkgold', 'hud', 'vice', 'fire', 'cs2'], FONTS = ['manrope', 'montserrat', 'unbounded', 'oswald', 'rubik', 'inter'], SIZES = ['sm', 'md', 'lg'];
  const per = { day: 'ТОП ДНЯ', week: 'ТОП НЕДЕЛИ', month: 'ТОП МЕСЯЦА', all: 'ТОП ДОНАТЕРОВ' };
  const root = document.getElementById('root'), pick = (v, list) => list.includes(v) ? v : list[0];
  let set = {}, top = [];

  // значок уровня в стиле FACEIT: топ-1 = 10 лвл, топ-2 = 9 … (не ниже 1)
  const LVC = l => l >= 10 ? '#fe1f00' : l >= 8 ? '#ff6309' : l >= 4 ? '#ffc800' : l >= 2 ? '#1ce400' : '#eeeeee';
  function lvSvg(l) { const L = 2 * Math.PI * 15 * .75, c = LVC(l);
    return `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#1a1a1a"/><circle cx="20" cy="20" r="15" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="4" stroke-dasharray="${L} 999" transform="rotate(135 20 20)"/><circle cx="20" cy="20" r="15" fill="none" stroke="${c}" stroke-width="4" stroke-dasharray="${L * l / 10} 999" transform="rotate(135 20 20)"/><text x="20" y="25.5" text-anchor="middle" font-family="Oswald,Arial" font-weight="700" font-size="${l >= 10 ? 14 : 16}" fill="${c}">${l}</text></svg>`; }
  // плавно: кто обогнал — едет вверх, остальные съезжают, сумма «досчитывается»
  const key = n => String(n || '').trim().toLowerCase();
  let shown = new Map(); // key -> {pos, total}
  function countUp(el, from, to) {
    if (from === to) { el.textContent = fmt(to); return; }
    const t0 = performance.now(), dur = 1300; el.classList.remove('cnt'); void el.offsetWidth; el.classList.add('cnt');
    const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(Math.round(from + (to - from) * e)); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  function draw() {
    const rows = demo ? DEMO.slice(0, Math.min(10, Math.max(1, +set.count || 5))) : top;
    const list = document.getElementById('list');
    const old = new Map([...list.querySelectorAll('.row[data-k]')].map(r => [r.dataset.k, r.offsetTop]));
    const prev = shown; shown = new Map();
    list.innerHTML = rows.length
      ? rows.map((t, i) => { const k = key(t.name), p = prev.get(k), was = old.has(k) && p;
          return `<div class="row ${i === 0 ? 'first' : ''} ${was ? 'keep' : ''} ${was && i < p.pos ? 'up' : ''}" data-k="${esc(k)}" style="animation-delay:${was ? 0 : i * .06}s"><div class="l"><span class="pos">${i + 1}</span><span class="lv">${lvSvg(Math.max(1, 10 - i))}</span><span class="nm">${esc(t.name)}</span></div><span class="sm">${fmt(was ? p.total : t.total)}</span></div>`; }).join('')
      : `<div class="empty">${promo ? PROMO : '<span class="e1">Пока донатов нет — станьте первым!</span>'}</div>`;
    rows.forEach((t, i) => shown.set(key(t.name), { pos: i, total: +t.total || 0 }));
    const moved = [];
    list.querySelectorAll('.row[data-k]').forEach(r => {
      const k = r.dataset.k, p = prev.get(k), now = shown.get(k);
      if (p && old.has(k)) {
        const dy = old.get(k) - r.offsetTop;
        if (dy) { r.style.translate = `0 ${dy}px`; moved.push(r); }
        if (p.total !== now.total) countUp(r.querySelector('.sm'), p.total, now.total);
      }
    });
    if (moved.length) { void list.offsetHeight; requestAnimationFrame(() => moved.forEach(r => { r.classList.add('mv'); r.style.translate = '0 0'; })); }
  }
  // пока донатов нет: каждые 30 сек на 7 сек показываем рекламу KZStream
  const PROMO = `<div class="promo"><div class="pl"><span class="pm"><svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13l10.5-6.5z"/></svg></span><span class="pt">KZStream</span></div><div class="ps">Лучший донат-сервис для TikTok Live</div></div>`;
  let promo = false;
  setInterval(() => { if (demo || top.length) return; promo = true; draw(); setTimeout(() => { promo = false; if (!top.length) draw(); }, 7000); }, 30000);
  function apply() {
    theme(set.theme);
    root.className = `st-${pick(set.style, STYLES)} f-${pick(set.font, FONTS)} sz-${pick(set.size, ['md', ...SIZES])}`;
    const o = Math.min(1, Math.max(.3, +set.opacity || .9)), r = Math.min(32, Math.max(0, set.radius == null ? 16 : +set.radius || 0));
    root.style.setProperty('--o', o); root.style.setProperty('--r', r + 'px');
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--w-bg').trim();
    root.style.setProperty('--bg', bg.replace(/,\s*[\d.]+\)$/, `,${o})`));
    // своё фото в шапке (или на весь виджет) и свой цвет строк — поверх любого дизайна
    const bgu = String(set.bg || '');
    root.classList.toggle('cust-bg', !!bgu && !set.bgall); root.classList.toggle('cust-bgall', !!bgu && !!set.bgall);
    root.style.setProperty('--hbg', bgu ? `url("${bgu.replace(/"/g, '')}")` : 'none');
    root.classList.toggle('cust-row', !!set.row); if (set.row) root.style.setProperty('--rc', set.row);
    root.classList.toggle('cust-tx', !!set.rowtx); if (set.rowtx) root.style.setProperty('--rt', set.rowtx);
    document.getElementById('h').textContent = String(set.title || '').trim() || per[set.period] || per.all;
    draw();
  }
  on('state', st => { set = st.settings.top; top = st.top; document.getElementById('ad').style.display = st.plan.ads ? '' : 'none'; apply(); });
  on('settings', s => { set = s.top; apply(); });
  on('stats', d => { top = d.top; draw(); });
  // живое превью из кабинета: настройки приходят до сохранения
  if (demo) addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.kzTop) { set = { ...set, ...e.data.kzTop }; apply(); } });
  start();
})();
</script></body></html>
