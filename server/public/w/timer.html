<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>KZStream — таймер</title>
<link rel="stylesheet" href="/w/w.css">
<style>
  .panel{display:inline-flex;flex-direction:column;align-items:center;margin:10px;padding:16px 28px}
  .lbl{font-size:13px;font-weight:800;letter-spacing:.12em;opacity:.75}
  #t{font-family:Unbounded;font-size:56px;font-weight:800;font-variant-numeric:tabular-nums}
  .plus{position:fixed;left:50%;top:40%;font-family:Unbounded;font-size:28px;color:var(--w-b);animation:up 1.8s forwards;text-shadow:0 2px 10px #000}
  @keyframes up{to{transform:translateY(-60px);opacity:0}}
</style></head><body>
<div class="panel"><span class="lbl">ДО КОНЦА СТРИМА</span><span id="t" class="grad">00:00:00</span></div>
<script src="/w/widget.js"></script>
<script>
(() => {
  const { on, start, theme } = KZ; let T = null, base = 0, spd = 30;
  function set(t) { T = t; base = Date.now(); }
  function tick() {
    if (!T) return; let left = T.running ? T.left - (Date.now() - base) : T.left; left = Math.max(0, left);
    const s = Math.floor(left / 1000); document.getElementById('t').textContent = [s / 3600 | 0, (s % 3600) / 60 | 0, s % 60].map(n => String(n).padStart(2, '0')).join(':');
  }
  on('state', st => { if (!st.plan.timer) { document.body.innerHTML = '<p style="font:15px sans-serif;padding:14px">Таймер доступен с тарифа Lite</p>'; return; } theme(st.settings.timer.theme); spd = st.settings.timer.sec_per_100; set(st.timer); });
  on('settings', s => { theme(s.timer.theme); spd = s.timer.sec_per_100; });
  on('stats', d => set(d.timer));
  on('donation', d => { if (!T?.running) return; const add = Math.floor(d.amount / 100) * spd; if (!add) return; const el = document.createElement('div'); el.className = 'plus'; el.textContent = `+${Math.round(add / 60)} мин`; document.body.appendChild(el); setTimeout(() => el.remove(), 1900); });
  setInterval(tick, 250);
  start();
})();
</script></body></html>
