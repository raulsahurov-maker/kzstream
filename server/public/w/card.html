<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>KZStream — карточка</title>
<link rel="stylesheet" href="/w/w.css">
<style>
  .cd{display:flex;align-items:center;gap:18px;padding:8px 34px 8px 8px;border-radius:16px;background:rgba(10,11,18,.9);border:2px solid var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 45%,transparent),0 12px 34px rgba(0,0,0,.45);color:#fff;width:max-content;opacity:0;transform:translateY(8px);transition:.4s}
  .cd.on{opacity:1;transform:none}
  .lg{width:52px;height:52px;border-radius:12px;overflow:hidden;flex:none;display:grid;place-items:center;background:var(--c)}
  .lg img{width:100%;height:100%;object-fit:cover}.lg svg{width:40px;height:40px}
  .tx{display:flex;flex-direction:row;align-items:baseline;gap:16px;min-width:0;flex-wrap:nowrap}
  .t1{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c2)}
  .t2{font-family:Unbounded,sans-serif;font-weight:800;font-size:24px;letter-spacing:.02em;white-space:nowrap}
  .pr{font-size:14px;font-weight:800;white-space:nowrap;padding:3px 10px;border-radius:8px;border:1px dashed var(--c2);color:var(--c2);align-self:center}.pr b{color:#fff;letter-spacing:.05em}
  .tall .pr{align-self:flex-start;margin-top:3px}
  .t3{font-size:15px;font-weight:700;opacity:.8;white-space:nowrap}.t3:empty{display:none}
  /* «толстая» форма (&l=tall): крупный логотип, текст в три строки */
  .tall .cd{gap:16px;padding:12px 26px 12px 12px;border-radius:20px;min-width:0}
  .tall .lg{width:76px;height:76px;border-radius:18px}.tall .lg svg{width:46px;height:46px}
  .tall .tx{flex-direction:column;align-items:flex-start;gap:3px}
  .tall .t2{font-size:30px}.tall .t3{font-size:14px}
  /* сменяющаяся карточка: переворот на следующую */
  .cd.flip-out{animation:fo .45s ease-in forwards}
  .cd.flip-in{animation:fi .55s cubic-bezier(.2,1.3,.4,1) both}
  @keyframes fo{to{transform:perspective(700px) rotateX(90deg);opacity:.2}}
  @keyframes fi{from{transform:perspective(700px) rotateX(-90deg);opacity:.2}}
</style></head><body>
<div class="cd" id="cd" data-fit></div>
<script src="/w/widget.js"></script>
<script>
(() => {
  const { on, start, esc } = KZ;
  const qs = new URLSearchParams(location.search), K = qs.get('k') || 'kaspi', demo = qs.has('demo');
  if (qs.get('l') === 'tall') document.documentElement.classList.add('tall');
  const SV = {
    twitch: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 2 2.5 6v14h5v3h3l3-3h4l5-5V2H4zm16 12-3 3h-5l-3 3v-3H5V4h15v10z"/><path d="M15 7h2v5h-2zM10 7h2v5h-2z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff"/></svg>',
    youtube: '<svg viewBox="0 0 24 24"><rect x="1.5" y="5" width="21" height="14" rx="4" fill="#fff"/><path d="M10 9v6l5-3z" fill="#ff0000"/></svg>',
    telegram: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M21.6 4.2 2.9 11.4c-1.3.5-1.3 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.6.1.9.8.9.5 0 .7-.2 1-.5l2.3-2.3 4.8 3.6c.9.5 1.5.2 1.7-.8l3.1-14.7c.3-1.3-.5-1.9-1.4-1.6zM8.9 14.1l9.6-6.1c.5-.3.9-.1.5.2l-8.1 7.3-.3 3.4-1.7-4.8z"/></svg>',
  };
  const META = {
    kaspi: { t: 'Kaspi', c: '#f14635', c2: '#ff8a7a', img: '/img/logo/kaspi.png', hint: 'Перевод на Kaspi' },
    halyk: { t: 'Halyk Bank', c: '#1a8a6a', c2: '#f5b52e', img: '/img/logo/halyk.png', hint: 'Перевод на Halyk' },
    freedom: { t: 'Freedom Bank', c: '#3bb54a', c2: '#7be08a', img: '/img/logo/freedom.png', hint: 'Перевод на Freedom' },
    twitch: { t: 'Twitch', c: '#9146ff', c2: '#c9a7ff', svg: SV.twitch, hint: 'twitch.tv/' },
    instagram: { t: 'Instagram', c: '#e1306c', c2: '#ffb37a', svg: SV.instagram, bg: 'linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)', hint: '@' },
    youtube: { t: 'YouTube', c: '#ff0000', c2: '#ff8080', svg: SV.youtube, hint: 'youtube.com/@' },
    telegram: { t: 'Telegram', c: '#229ed9', c2: '#8fd3ff', svg: SV.telegram, hint: 't.me/' },
    blackrussia: { t: 'Black Russia', c: '#ff4a12', c2: '#ff9a3c', img: '/img/logo/blackrussia.png', bg: '#000', pre: 'Сервер: ' },
  };
  // несколько карточек через запятую (k=kaspi,halyk,telegram) — сменяются по кругу, &iv= секунд
  const KS = K.split(',').filter(k => META[k]).slice(0, 10), IV = Math.min(60, Math.max(2, +qs.get('iv') || 5)) * 1000;
  let M = META[KS[0]] || META.kaspi;
  const setM = k => { M = META[k] || META.kaspi; document.documentElement.style.setProperty('--c', M.c); document.documentElement.style.setProperty('--c2', M.c2); };
  setM(KS[0]);
  let CARDS = {}, idx = 0, rot = null;
  function multi(cards) {
    CARDS = cards || {}; const list = KS.filter(k => CARDS[k] && CARDS[k].value);
    clearInterval(rot);
    if (list.length <= 1) { idx = 0; if (list[0]) setM(list[0]); draw(list[0] ? CARDS[list[0]] : null); return; }
    idx = idx % list.length; setM(list[idx]); draw(CARDS[list[idx]]);
    rot = setInterval(() => {
      const el = document.getElementById('cd'), L = KS.filter(k => CARDS[k] && CARDS[k].value); if (L.length < 2) return;
      el.classList.remove('flip-in'); el.classList.add('flip-out');
      setTimeout(() => { idx = (idx + 1) % L.length; setM(L[idx]); draw(CARDS[L[idx]]); el.classList.remove('flip-out'); void el.offsetWidth; el.classList.add('flip-in'); if (demo) requestAnimationFrame(pvFit); }, 450);
    }, IV);
  }
  function draw(c) {
    const el = document.getElementById('cd');
    if (!c || !c.value) { el.classList.remove('on'); el.innerHTML = demo ? '' : ''; return; }
    el.innerHTML = `<div class="lg" style="${M.bg ? 'background:' + M.bg : ''}">${M.img ? `<img src="${M.img}" alt="">` : M.svg}</div><div class="tx"><div class="t1">${M.t}</div><div class="t2">${esc(c.value)}</div>${c.name ? `<div class="t3">${M.pre || ''}${esc(c.name)}</div>` : ''}${c.promo ? `<div class="pr">🎁 Промокод: <b>${esc(c.promo)}</b></div>` : ''}</div>`;
    requestAnimationFrame(() => el.classList.add('on'));
  }
  // превью в кабинете: ужимаем карточку под маленькое окошко
  const pvFit = () => { const el = document.getElementById('cd'); el.style.zoom = 1; el.style.maxWidth = 'none'; const w = el.scrollWidth, h = el.offsetHeight; if (w && h) el.style.zoom = Math.min(1, (innerWidth - 16) / w, (innerHeight - 10) / h); };
  if (demo) { addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.kzCard) { draw(e.data.kzCard); requestAnimationFrame(pvFit); } if (e.origin === location.origin && e.data && e.data.kzCards) { multi(e.data.kzCards); requestAnimationFrame(pvFit); } }); addEventListener('resize', pvFit); return; }
  on('state', st => multi(st.settings.cards));
  on('settings', s => s.cards && multi(s.cards));
  start();
})();
</script></body></html>
