<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>KZStream — алерты</title>
<link rel="stylesheet" href="/w/w.css">
<style>
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .alert{text-align:center;max-width:86vw;opacity:0;transform:translateY(40px) scale(.85);transition:.6s cubic-bezier(.2,1.35,.4,1);display:flex;flex-direction:column;align-items:center}
  .alert.show{opacity:1;transform:none}
  .alert.hide{opacity:0;transform:translateY(-24px) scale(.95);transition:.4s}
  .media{max-width:340px;max-height:260px;display:block;border-radius:16px;margin-bottom:-18px;position:relative;z-index:1;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5))}
  .box{position:relative;padding:26px 34px 20px;border-radius:24px;background:var(--w-bg);min-width:380px;max-width:820px;box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 60px color-mix(in srgb,var(--w-a) 35%,transparent)}
  .box::before{content:"";position:absolute;inset:0;border-radius:24px;padding:2px;background:linear-gradient(120deg,var(--w-a),var(--w-b));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .title{font-family:Unbounded,sans-serif;font-weight:800;font-size:34px;line-height:1.2}
  .title .sum{background:linear-gradient(120deg,var(--w-a),var(--w-b));-webkit-background-clip:text;background-clip:text;color:transparent}
  .vtext{font-family:Unbounded;font-weight:800;font-size:20px;color:var(--w-b);margin-top:6px}
  .msg{margin-top:12px;font-size:24px;font-weight:700;line-height:1.35;word-wrap:break-word;opacity:.95}
  .def{font-size:84px;line-height:1;animation:b 1s infinite;display:inline-block;margin-bottom:-14px;position:relative;z-index:1;filter:drop-shadow(0 8px 20px rgba(0,0,0,.5))}
  @keyframes b{50%{transform:translateY(-12px) rotate(-6deg)}}
  .spark{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--w-b);animation:sp 1.2s ease-out forwards}
  @keyframes sp{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
</style></head>
<body>
<div id="stage"></div>
<div class="unmute" id="unmute">🔊 Нажмите, чтобы включить звук (в OBS не нужно)</div>
<script src="/w/widget.js"></script>
<script>
(() => {
  const { on, start, theme, fmt, esc, token } = KZ;
  let S = null, PLAN = null, queue = [], busy = false, skipFn = null;
  const DEF_SOUND = 'data:audio/wav;base64,' + makeChime();

  on('state', st => { S = st.settings.alerts; PLAN = st.plan; theme(S.theme); });
  on('settings', s => { S = s.alerts; theme(S.theme); });
  on('donation', d => { if (d.show) { queue.push(d); next(); } });
  on('skip', () => skipFn && skipFn());

  function wait(ms) { return new Promise(r => { const t = setTimeout(r, ms); skipFn = () => { clearTimeout(t); r(); }; }); }
  function playAudio(src, vol) {
    return new Promise(res => {
      const a = new Audio(src); a.volume = vol ?? S.volume;
      const done = () => { skipFn = null; res(); };
      a.onended = done; a.onerror = () => res('error');
      skipFn = () => { a.pause(); done(); };
      a.play().catch(() => { document.getElementById('unmute').style.display = 'block'; res('blocked'); });
    });
  }
  function chunks(text) {
    const out = []; let cur = '';
    for (const w of text.split(/\s+/)) { if ((cur + ' ' + w).length > 180) { out.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w; }
    if (cur) out.push(cur); return out;
  }
  function speakBrowser(text) {
    return new Promise(res => {
      if (!window.speechSynthesis) return res();
      const u = new SpeechSynthesisUtterance(text); u.lang = { ru: 'ru-RU', kk: 'kk-KZ', en: 'en-US', tr: 'tr-TR', uk: 'uk-UA' }[S.tts_lang] || 'ru-RU';
      u.rate = S.tts_rate || 1; u.volume = S.volume; u.onend = res; u.onerror = res;
      skipFn = () => { speechSynthesis.cancel(); res(); };
      speechSynthesis.speak(u);
    });
  }
  async function speak(text) {
    for (const c of chunks(text)) {
      const r = await playAudio(`/api/tts?t=${encodeURIComponent(token)}&lang=${S.tts_lang}&text=${encodeURIComponent(c)}`);
      if (r === 'error') { await speakBrowser(c); }
      if (r === 'blocked') return;
    }
  }
  function mediaEl(src) {
    if (!src) return '<div class="def">💸</div>';
    if (/\.(mp4|webm)$/i.test(src)) return `<video class="media" src="${esc(src)}" autoplay muted loop playsinline></video>`;
    return `<img class="media" src="${esc(src)}">`;
  }
  async function next() {
    if (busy || !queue.length || !S) return; busy = true;
    const d = queue.shift(), v = d.variation;
    const stage = document.getElementById('stage');
    stage.innerHTML = `<div class="alert">${mediaEl(v?.gif || S.gif)}<div class="box">
      <div class="title">${esc(d.name)} — <span class="sum">${fmt(d.amount)}</span></div>
      ${v?.text ? `<div class="vtext">${esc(v.text)}</div>` : ''}
      ${d.message ? `<div class="msg">${esc(d.message)}</div>` : ''}</div></div>`;
    const el = stage.firstElementChild; requestAnimationFrame(() => el.classList.add('show'));
    const box = el.querySelector('.box');
    for (let i = 0; i < 18; i++) { const sp = document.createElement('i'); sp.className = 'spark'; const a = Math.random() * 6.28, r = 120 + Math.random() * 160; sp.style.cssText = `left:50%;top:50%;--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r}px;animation-delay:${.3 + Math.random() * .3}s;opacity:0`; box.appendChild(sp); }
    const t0 = Date.now();
    await playAudio(v?.sound || S.sound || DEF_SOUND);
    if (d.voice_url) await playAudio(d.voice_url, 1);
    if (d.tts) {
      const txt = (PLAN.ttsAdvanced && !S.tts_read_name) ? d.message : `${d.name} — ${d.amount} тенге. ${d.message || ''}`;
      if (txt && txt.trim()) await speak(txt);
    }
    const left = S.duration * 1000 - (Date.now() - t0);
    if (left > 0) await wait(left);
    el.classList.add('hide'); await new Promise(r => setTimeout(r, 450));
    stage.innerHTML = ''; skipFn = null; busy = false;
    setTimeout(next, 400);
  }
  document.getElementById('unmute').onclick = function () { this.style.display = 'none'; };
  window.KZunlock = () => { const a = new Audio(DEF_SOUND); a.volume = 0.01; a.play().catch(() => {}); document.getElementById('unmute').style.display = 'none'; };

  // короткий стандартный звук (генерируется, без внешних файлов)
  function makeChime() {
    const sr = 22050, len = sr * 0.9, buf = new DataView(new ArrayBuffer(44 + len * 2));
    const w = (o, s) => [...s].forEach((c, i) => buf.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); buf.setUint32(4, 36 + len * 2, true); w(8, 'WAVEfmt '); buf.setUint32(16, 16, true); buf.setUint16(20, 1, true); buf.setUint16(22, 1, true);
    buf.setUint32(24, sr, true); buf.setUint32(28, sr * 2, true); buf.setUint16(32, 2, true); buf.setUint16(34, 16, true); w(36, 'data'); buf.setUint32(40, len * 2, true);
    for (let i = 0; i < len; i++) { const t = i / sr, f = t < .15 ? 880 : t < .3 ? 1175 : 1568; const v = Math.sin(2 * Math.PI * f * t) * Math.exp(-3 * (t % .3 + (t > .3 ? t - .3 : 0))) * .5; buf.setInt16(44 + i * 2, v * 32767, true); }
    let s = ''; const b = new Uint8Array(buf.buffer); for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s);
  }
  start();
})();
</script>
</body></html>
