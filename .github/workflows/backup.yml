name: Резервная копия базы

on:
  schedule:
    - cron: '13 22 * * *'   # каждый день в 03:13 по Алматы
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Скачать зашифрованную копию
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o kzstream-db.kzb -w "%{http_code}" --max-time 120 https://kzstream.onrender.com/api/backup) && [ "$code" = "200" ] && break
            echo "Попытка $i: $code"; sleep 40
          done
          [ "$code" = "200" ] || exit 1
          head -c 4 kzstream-db.kzb | grep -q KZB1
          ls -la kzstream-db.kzb
      # копия зашифрована открытым ключом — без закрытого ключа владельца её не открыть
      - uses: actions/upload-artifact@v4
        with:
          name: kzstream-db-${{ github.run_number }}
          path: kzstream-db.kzb
          retention-days: 30
