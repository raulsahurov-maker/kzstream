name: Сборка приложений KZStream

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK (уже есть на раннере)
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties && yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Сборка APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk KZStream.apk
      - uses: actions/upload-artifact@v4
        with: { name: KZStream-android, path: KZStream.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: PyInstaller со своим загрузчиком (меньше ложных срабатываний антивирусов)
        env: { PYINSTALLER_COMPILE_BOOTLOADER: '1' }
        run: |
          pip install -r windows/requirements.txt
          pip install --no-binary pyinstaller "pyinstaller==6.11.1"
      - name: Сборка программы (папка, без самораспаковки)
        working-directory: windows
        run: |
          pyinstaller --noconfirm --onedir --windowed --name KZStream --icon icon.ico --version-file version_info.txt --add-data "ui.html;." --add-data "icon.ico;." --add-data "qrcode.js;." --hidden-import pystray._win32 --collect-submodules winsdk.windows.ui.notifications --collect-submodules winsdk.windows.devices --collect-submodules winsdk.windows.storage.streams --hidden-import iphone_bt --collect-submodules webview kzstream_windows.py
      - name: Самопроверка (всё ли внутри)
        working-directory: windows
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\KZStream\KZStream.exe -ArgumentList '--selftest' -Wait -PassThru
          $r = Get-Content dist\KZStream\selftest.txt -Raw
          Write-Host "Результат: $r (код $($p.ExitCode))"
          Remove-Item dist\KZStream\selftest.txt
          if (-not $r.StartsWith('OK')) { exit 1 }
      - name: Пробный запуск окна (интерфейс + трей)
        working-directory: windows
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\KZStream\KZStream.exe -ArgumentList '--smoketest' -PassThru
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; Write-Host 'Окно не закрылось за 90 сек' }
          $r = Get-Content dist\KZStream\smoke.txt -Raw -ErrorAction SilentlyContinue
          Write-Host "Результат запуска: $r"
          Remove-Item dist\KZStream\smoke.txt, dist\KZStream\smoke.png -ErrorAction SilentlyContinue
          if (-not "$r".StartsWith('OK')) { exit 1 }
      - name: Установщик (Inno Setup)
        working-directory: windows
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Проверка установщика (тихая установка и запуск)
        working-directory: windows
        shell: pwsh
        run: |
          $p = Start-Process -FilePath output\KZStream-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          $exe = "$env:LOCALAPPDATA\Programs\KZStream\KZStream.exe"
          if (-not (Test-Path $exe)) { Write-Host 'Программа не установилась'; exit 1 }
          $q = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru
          $r = Get-Content "$env:LOCALAPPDATA\Programs\KZStream\selftest.txt" -Raw
          Write-Host "Установлено, проверка: $r"
          if (-not $r.StartsWith('OK')) { exit 1 }
      - name: Проверка обновления поверх запущенной программы
        working-directory: windows
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\KZStream\KZStream.exe"
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $p = Start-Process -FilePath output\KZStream-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Write-Host "Код установщика при запущенной программе: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          Get-Process KZStream -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Файлы для скачивания
        shell: pwsh
        run: |
          Copy-Item windows\output\KZStream-Setup.exe KZStream-Setup.exe
          Copy-Item windows\output\KZStream-Setup.exe KZStream.exe
          Compress-Archive -Path windows\output\KZStream-Setup.exe -DestinationPath KZStream-Windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: KZStream-windows, path: "KZStream-Setup.exe\nKZStream.exe\nKZStream-Windows.zip" }

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Публикация в Releases (ссылки для скачивания)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: KZStream — последняя версия
          make_latest: true
          files: |
            KZStream.apk
            KZStream.exe
            KZStream-Setup.exe
            KZStream-Windows.zip
