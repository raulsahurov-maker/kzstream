name: Сборка приложений KZStream

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK (уже есть на раннере)
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties && yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Сборка APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk KZStream.apk
      - uses: actions/upload-artifact@v4
        with: { name: KZStream-android, path: KZStream.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Сборка EXE
        working-directory: windows
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --onefile --windowed --name KZStream --icon icon.ico --add-data "ui.html;." kzstream_windows.py
      - run: copy windows\dist\KZStream.exe KZStream.exe
      - uses: actions/upload-artifact@v4
        with: { name: KZStream-windows, path: KZStream.exe }

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Публикация в Releases (ссылки для скачивания)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: KZStream — последняя версия
          make_latest: true
          files: |
            KZStream.apk
            KZStream.exe
